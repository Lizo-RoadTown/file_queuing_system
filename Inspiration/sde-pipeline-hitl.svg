<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
    <path d="M2,2 L12,7 L2,12 Z" fill="#555"/>
  </marker>
  <marker id="redarrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
    <path d="M2,2 L12,7 L2,12 Z" fill="#b85543"/>
  </marker>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 40px; font-weight: 800; fill: #2f322f; }
    .sub { font-family: Arial, sans-serif; font-size: 20px; fill: #5f625f; }
    .lane { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #888; letter-spacing: 2px; }
    .smallcaps { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #666; letter-spacing: 1.5px; }
    .caption { font-family: Arial, sans-serif; font-size: 16px; fill: #585858; }
    .footnote { font-family: Arial, sans-serif; font-size: 14px; font-style: italic; fill: #707070; }
  </style>
</defs>

<rect width="1800" height="1100" fill="#fbfaf7"/>

<!-- Title -->
<text x="80" y="64" class="title">Pipeline A  ·  Single Database Provenance</text>
<text x="80" y="96" class="sub">The curated object enters one database. Evidence accumulates as annotation tags while the object passes through internal zones.</text>

<!-- Lane labels on left edge (rotated) -->
<text x="44" y="600" class="lane" transform="rotate(-90 44 600)">DATABASE IS THE CENTER OF GRAVITY</text>

<!-- Trust boundary -->
<line x1="680" y1="150" x2="680" y2="940" stroke="#b85543" stroke-width="3" stroke-dasharray="14,10"/>
<text x="688" y="174" class="smallcaps" fill="#9b3f31">TRUST / CUSTODY BOUNDARY</text>

<!-- ============ CURATOR SIDE (LEFT) — small, peripheral ============ -->

<!-- GitHub curation box -->
<rect x="100" y="200" width="540" height="180" rx="20" fill="#efedff" stroke="#4b3c9d" stroke-width="3"/>
<text x="370" y="240" text-anchor="middle" font-size="22" font-weight="800" fill="#4b3c9d" font-family="Arial">GitHub curation layer</text>
<rect x="130" y="262" width="130" height="32" rx="16" fill="#4b3c9d"/>
<text x="195" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">notebook</text>
<rect x="270" y="262" width="130" height="32" rx="16" fill="#4b3c9d"/>
<text x="335" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">metadata.yml</text>
<rect x="410" y="262" width="120" height="32" rx="16" fill="#4b3c9d"/>
<text x="470" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">Actions logs</text>
<rect x="130" y="305" width="100" height="32" rx="16" fill="#7568c8"/>
<text x="180" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">commits</text>
<rect x="240" y="305" width="120" height="32" rx="16" fill="#7568c8"/>
<text x="300" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">comments</text>
<rect x="370" y="305" width="80" height="32" rx="16" fill="#7568c8"/>
<text x="410" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">labels</text>
<text x="370" y="365" text-anchor="middle" class="footnote">controller: curators · verifier: anyone via git</text>

<!-- Arrow down from GitHub to Bridge -->
<line x1="370" y1="396" x2="370" y2="438" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
<text x="384" y="423" class="caption">reviewer /approve</text>

<!-- Bridge package box -->
<rect x="100" y="450" width="540" height="160" rx="20" fill="#e8f4f8" stroke="#235b73" stroke-width="3"/>
<text x="370" y="490" text-anchor="middle" font-size="22" font-weight="800" fill="#235b73" font-family="Arial">Bridge package</text>
<rect x="130" y="512" width="180" height="32" rx="16" fill="#235b73"/>
<text x="220" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">packing slip</text>
<rect x="322" y="512" width="160" height="32" rx="16" fill="#235b73"/>
<text x="402" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">per-file SHA-256</text>
<rect x="494" y="512" width="130" height="32" rx="16" fill="#235b73"/>
<text x="559" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">bridge SHA</text>
<text x="370" y="595" text-anchor="middle" class="footnote">controller: Bridge workflow · verifier: receiver recomputes hashes</text>

<!-- Arrow crossing the trust boundary into the cylinder -->
<line x1="640" y1="530" x2="730" y2="530" stroke="#b85543" stroke-width="4" marker-end="url(#redarrow)"/>
<text x="685" y="516" text-anchor="middle" font-size="13" font-weight="700" fill="#9b3f31" font-family="Arial">HTTPS POST</text>
<text x="685" y="555" text-anchor="middle" font-size="13" font-weight="700" fill="#9b3f31" font-family="Arial">+ hash verify</text>

<!-- ============ HERO: DATABASE CYLINDER (RIGHT) ============ -->

<!-- Cylinder shape -->
<path d="M 720 200 C 720 165, 1720 165, 1720 200 L 1720 860 C 1720 895, 720 895, 720 860 Z" fill="#fcf0e8" stroke="#7e3a20" stroke-width="4"/>
<ellipse cx="1220" cy="200" rx="500" ry="22" fill="#fcf0e8" stroke="#7e3a20" stroke-width="4"/>

<!-- Cylinder header -->
<text x="1220" y="252" text-anchor="middle" font-size="30" font-weight="800" fill="#7e3a20" font-family="Arial">SINGLE HITL DATABASE</text>

<!-- INTAKE zone -->
<rect x="760" y="290" width="920" height="135" rx="18" fill="#fffaf7" stroke="#ba7d58" stroke-width="2.5"/>
<text x="800" y="330" font-size="26" font-weight="800" fill="#7e3a20" font-family="Arial">INTAKE</text>
<text x="800" y="358" font-size="15" fill="#777" font-family="Arial">arrival lands · checksums recomputed against the packing slip</text>
<text x="800" y="388" class="smallcaps" fill="#7e3a20">EVIDENCE ACCUMULATED</text>
<rect x="800" y="398" width="170" height="22" rx="11" fill="#ba7d58"/>
<text x="885" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">validator_passed_at</text>
<rect x="980" y="398" width="120" height="22" rx="11" fill="#ba7d58"/>
<text x="1040" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">arrival_id</text>
<rect x="1110" y="398" width="140" height="22" rx="11" fill="#ba7d58"/>
<text x="1180" y="414" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">audit_log row</text>

<!-- Arrow INTAKE -> STAGING (inside cylinder, on the right side) -->
<line x1="1620" y1="380" x2="1620" y2="450" stroke="#7e3a20" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1640" y="420" font-size="12" font-style="italic" fill="#7e3a20" font-family="Arial">tags added</text>

<!-- STAGING zone -->
<rect x="760" y="445" width="920" height="135" rx="18" fill="#fffaf7" stroke="#ba7d58" stroke-width="2.5"/>
<text x="800" y="485" font-size="26" font-weight="800" fill="#7e3a20" font-family="Arial">STAGING</text>
<text x="800" y="513" font-size="15" fill="#777" font-family="Arial">PI is notified · runs their engine externally · records verdict</text>
<text x="800" y="543" class="smallcaps" fill="#7e3a20">EVIDENCE ACCUMULATED  (same row, more tags)</text>
<rect x="800" y="553" width="150" height="22" rx="11" fill="#ba7d58"/>
<text x="875" y="569" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">pi_notified_at</text>
<rect x="960" y="553" width="170" height="22" rx="11" fill="#ba7d58"/>
<text x="1045" y="569" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">engine_run_external</text>
<rect x="1140" y="553" width="110" height="22" rx="11" fill="#ba7d58"/>
<text x="1195" y="569" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">pi_verdict</text>

<!-- Arrow STAGING -> STORED -->
<line x1="1620" y1="580" x2="1620" y2="605" stroke="#7e3a20" stroke-width="3" marker-end="url(#arrow)"/>

<!-- STORED zone -->
<rect x="760" y="600" width="920" height="135" rx="18" fill="#fffaf7" stroke="#ba7d58" stroke-width="2.5"/>
<text x="800" y="640" font-size="26" font-weight="800" fill="#7e3a20" font-family="Arial">STORED</text>
<text x="800" y="668" font-size="15" fill="#777" font-family="Arial">verified · stable rows · split into separate tables by verdict</text>
<text x="800" y="698" class="smallcaps" fill="#7e3a20">EVIDENCE FINAL FORM</text>
<rect x="800" y="708" width="170" height="22" rx="11" fill="#ba7d58"/>
<text x="885" y="724" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">signoff_timestamp</text>
<rect x="980" y="708" width="110" height="22" rx="11" fill="#ba7d58"/>
<text x="1035" y="724" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">approved</text>
<rect x="1100" y="708" width="100" height="22" rx="11" fill="#ba7d58"/>
<text x="1150" y="724" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">rejected</text>
<rect x="1210" y="708" width="78" height="22" rx="11" fill="#ba7d58"/>
<text x="1249" y="724" text-anchor="middle" font-size="13" font-weight="700" fill="white" font-family="Arial">other</text>

<!-- Cross-cutting evidence band INSIDE cylinder bottom -->
<rect x="760" y="755" width="920" height="100" rx="14" fill="#fff6de" stroke="#9b7226" stroke-width="2.5"/>
<text x="1220" y="781" text-anchor="middle" font-size="17" font-weight="800" fill="#7b5819" font-family="Arial">CROSS-CUTTING DATABASE OBSERVABILITY  (spans all three zones)</text>
<rect x="800" y="795" width="190" height="32" rx="16" fill="#9b7226"/>
<text x="895" y="817" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">audit_log per INSERT</text>
<rect x="1000" y="795" width="220" height="32" rx="16" fill="#9b7226"/>
<text x="1110" y="817" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">tag-accumulation (no UPDATE)</text>
<rect x="1230" y="795" width="220" height="32" rx="16" fill="#9b7226"/>
<text x="1340" y="817" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">RLS append-only at engine</text>
<text x="1220" y="848" text-anchor="middle" class="footnote">The row data never changes between zones — only annotation tags accumulate.</text>

<!-- Public surfaces BELOW the cylinder, full width -->
<line x1="1220" y1="895" x2="1220" y2="925" stroke="#2f7354" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="80" y="930" width="1640" height="105" rx="18" fill="#e8f7ef" stroke="#2f7354" stroke-width="3"/>
<text x="120" y="965" font-size="22" font-weight="800" fill="#2f7354" font-family="Arial">Public / external observability surfaces  (opt-in, PI picks the combination)</text>
<rect x="120" y="980" width="160" height="34" rx="17" fill="#2f7354"/>
<text x="200" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">dashboard</text>
<rect x="295" y="980" width="120" height="34" rx="17" fill="#2f7354"/>
<text x="355" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">SQL / API</text>
<rect x="430" y="980" width="180" height="34" rx="17" fill="#2f7354"/>
<text x="520" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">Zenodo DOI dumps</text>
<rect x="625" y="980" width="150" height="34" rx="17" fill="#2f7354"/>
<text x="700" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">Figshare / OSF</text>
<rect x="790" y="980" width="170" height="34" rx="17" fill="#2f7354"/>
<text x="875" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">UF Institutional</text>
<rect x="975" y="980" width="140" height="34" rx="17" fill="#2f7354"/>
<text x="1045" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">RSS / Atom</text>
<rect x="1130" y="980" width="180" height="34" rx="17" fill="#2f7354"/>
<text x="1220" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">X / Bluesky / Mastodon</text>
<rect x="1325" y="980" width="160" height="34" rx="17" fill="#2f7354"/>
<text x="1405" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">ORCID notify</text>
<rect x="1500" y="980" width="160" height="34" rx="17" fill="#2f7354"/>
<text x="1580" y="1002" text-anchor="middle" font-size="14" font-weight="700" fill="white" font-family="Arial">email digest</text>

<!-- Reading-logic footer -->
<text x="80" y="1078" class="footnote">Reading logic: follow the curated object across the trust boundary into the cylinder, then read the three zones top-to-bottom. The row never changes — annotation tags accumulate. Public surfaces below are opt-in exports off the STORED zone.</text>

</svg>
