<text x="580" y="690" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="10">pull_request_url</text>
<text x="580" y="706" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="10">terraform_state_sha256</text>
<text x="580" y="722" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="10">workflow_yamls_sha256</text>
<text x="580" y="738" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="10">schema_migration_sha256 · description</text>

<!-- FK arrows: arrivals -> compute_runs -->
<line x1="200" y1="342" x2="200" y2="368" marker-end="url(#arrow)" stroke="rgb(245,196,179)" stroke-width="1.5"/>
<text x="210" y="358" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="10" font-weight="500">1:N</text>

<!-- FK arrows: compute_runs -> signoffs (array reference) -->
<line x1="200" y1="550" x2="200" y2="578" marker-end="url(#arrow)" stroke="rgb(245,196,179)" stroke-width="1.5"/>
<text x="210" y="568" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="10" font-weight="500">N:M (FK array)</text>

<!-- FK arrows: archive_receipts -> substrate_versions -->
<line x1="720" y1="342" x2="720" y2="578" marker-end="url(#arrow)" stroke="rgb(250,199,117)" stroke-width="1.5"/>
<text x="730" y="460" fill="rgb(250,199,117)" font-family="'Anthropic Sans',sans-serif" font-size="10" font-weight="500">N:1</text>
<text x="730" y="476" fill="rgb(250,199,117)" font-family="'Anthropic Sans',sans-serif" font-size="10" font-style="italic">substrate snapshot</text>
<text x="730" y="490" fill="rgb(250,199,117)" font-family="'Anthropic Sans',sans-serif" font-size="10" font-style="italic">bundled in each dump</text>

