<svg width="100%" viewBox="0 0 920 870" role="img" xmlns="http://www.w3.org/2000/svg">
<title>UF Curation Database — entity-relationship diagram</title>
<desc>Six tables: arrivals, compute_runs, signoffs, audit_log, archive_receipts, substrate_versions. All tables are append-only and public-readable. Arrows show foreign key relationships. The audit_log table is populated automatically by Postgres triggers from every other table. archive_receipts references substrate_versions to bundle a snapshot of the system itself into each weekly DOI deposit.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Title -->
<rect x="40" y="30" width="840" height="60" rx="12" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
<text x="460" y="56" text-anchor="middle" fill="rgb(211,209,199)" font-family="'Anthropic Sans',sans-serif" font-size="15" font-weight="500">UF Curation Database — entity-relationship diagram</text>
<text x="460" y="78" text-anchor="middle" fill="rgb(180,178,169)" font-family="'Anthropic Sans',sans-serif" font-size="12">Six append-only tables · all public-readable · audit_log populated automatically by triggers</text>

<!-- arrivals -->
<rect x="40" y="110" width="320" height="232" rx="10" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
<rect x="40" y="110" width="320" height="32" rx="10" fill="rgb(143,73,49)" stroke="none"/>
<text x="200" y="130" text-anchor="middle" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="600">arrivals · one row per submission</text>
<text x="60" y="156" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">id (uuid, PK)</text>
<text x="60" y="174" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">arrival_timestamp</text>
<text x="60" y="190" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">manifest_sha256 · manifest_signature</text>
<text x="60" y="206" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">bridge_sha256</text>
<text x="60" y="222" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">github_commit_sha · github_issue_url</text>
<text x="60" y="238" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">github_issue_comments_sha256</text>
<text x="60" y="254" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">curator_github · curator_orcid</text>
<text x="60" y="270" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">reviewer_github · reviewer_orcid</text>
<text x="60" y="286" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">paper_doi · paper_pdf_sha256</text>
<text x="60" y="302" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">notebook_sha256 (curation + testing parts)</text>
<text x="60" y="318" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">env_lockfile_sha256 · verification_status</text>
<text x="60" y="334" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">receipt_signature</text>

<!-- compute_runs -->
<rect x="40" y="370" width="320" height="180" rx="10" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
<rect x="40" y="370" width="320" height="32" rx="10" fill="rgb(143,73,49)" stroke="none"/>
<text x="200" y="390" text-anchor="middle" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="600">compute_runs · PI verification engine runs</text>
<text x="60" y="416" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">id (uuid, PK)</text>
<text x="60" y="432" fill="rgb(255,140,90)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">arrival_id (FK → arrivals.id)</text>
<text x="60" y="450" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">engine_sha256 · engine_version_tag</text>
<text x="60" y="466" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">container_image_sha · lockfile_sha256</text>
<text x="60" y="482" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">hardware_info (cpu · ram · gpu)</text>
<text x="60" y="498" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">seeds_used (array)</text>
<text x="60" y="514" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">started_at · completed_at · duration</text>
<text x="60" y="530" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">results · results_sha256 · verdict</text>

<!-- signoffs -->
<rect x="40" y="580" width="320" height="180" rx="10" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
<rect x="40" y="580" width="320" height="32" rx="10" fill="rgb(143,73,49)" stroke="none"/>
<text x="200" y="600" text-anchor="middle" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="600">signoffs · PI sign-off rows</text>
<text x="60" y="626" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">id (uuid, PK)</text>
<text x="60" y="642" fill="rgb(255,140,90)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">arrival_id (FK → arrivals.id)</text>
<text x="60" y="660" fill="rgb(255,140,90)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">compute_run_ids (FK array → compute_runs.id)</text>
<text x="60" y="678" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">pi_github · pi_orcid · pi_signature</text>
<text x="60" y="694" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">signoff_timestamp</text>
<text x="60" y="710" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="10">verdict · pi_notes</text>
<text x="60" y="726" fill="rgb(255,140,90)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">supersedes_signoff_id (self-ref, nullable)</text>

<!-- archive_receipts -->
<rect x="560" y="110" width="320" height="232" rx="10" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
<rect x="560" y="110" width="320" height="32" rx="10" fill="rgb(129,86,36)" stroke="none"/>
<text x="720" y="130" text-anchor="middle" fill="rgb(250,199,117)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="600">archive_receipts · weekly DOI dump</text>
<text x="580" y="156" fill="rgb(250,199,117)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">id (uuid, PK)</text>
<text x="580" y="174" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">period_start · period_end</text>
<text x="580" y="190" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">deposit_timestamp</text>
<text x="580" y="206" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">zenodo_concept_doi</text>
<text x="580" y="222" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">zenodo_version_doi</text>
<text x="580" y="238" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">zenodo_returned_checksum</text>
<text x="580" y="254" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">arrivals_included · compute_runs_included</text>
<text x="580" y="270" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">signoffs_included · audit_entries_included</text>
<text x="580" y="288" fill="rgb(255,180,80)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">substrate_version_id (FK → substrate_versions.id)</text>
<text x="580" y="306" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">substrate_snapshot_sha256</text>
<text x="580" y="322" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="10">bundle_sha256</text>

<!-- audit_log -->
<rect x="560" y="370" width="320" height="180" rx="10" fill="rgb(80,30,30)" stroke="rgb(200,100,100)" stroke-width="0.5"/>
<rect x="560" y="370" width="320" height="32" rx="10" fill="rgb(100,40,40)" stroke="none"/>
<text x="720" y="390" text-anchor="middle" fill="rgb(255,180,180)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="600">audit_log · trigger-populated</text>
<text x="580" y="416" fill="rgb(255,180,180)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">id (bigserial, PK)</text>
<text x="580" y="432" fill="rgb(200,140,140)" font-family="'Anthropic Sans',sans-serif" font-size="10">timestamp</text>
<text x="580" y="448" fill="rgb(200,140,140)" font-family="'Anthropic Sans',sans-serif" font-size="10">table_name · row_id</text>
<text x="580" y="464" fill="rgb(200,140,140)" font-family="'Anthropic Sans',sans-serif" font-size="10">action (always INSERT)</text>
<text x="580" y="480" fill="rgb(200,140,140)" font-family="'Anthropic Sans',sans-serif" font-size="10">actor_role</text>
<text x="580" y="496" fill="rgb(200,140,140)" font-family="'Anthropic Sans',sans-serif" font-size="10">payload (jsonb of the new row)</text>
<text x="580" y="518" fill="rgb(255,200,200)" font-family="'Anthropic Sans',sans-serif" font-size="10" font-style="italic">Triggers fire on arrivals · compute_runs ·</text>
<text x="580" y="534" fill="rgb(255,200,200)" font-family="'Anthropic Sans',sans-serif" font-size="10" font-style="italic">signoffs · archive_receipts · substrate_versions</text>

