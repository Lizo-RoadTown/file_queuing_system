<!-- Substrate Change Process -->
<rect x="40" y="450" width="740" height="194" rx="10" fill="rgb(50,50,55)" stroke="rgb(100,180,200)" stroke-width="1"/>
<text x="60" y="474" fill="rgb(170,220,240)" font-family="'Anthropic Sans',sans-serif" font-size="14" font-weight="600">SUBSTRATE CHANGE PROCESS · how the system itself gets modified</text>
<text x="60" y="494" fill="rgb(180,200,210)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-style="italic">No one — including PIs, agents, or admins — can change the system without going through this flow.</text>

<text x="60" y="520" fill="rgb(180,200,210)" font-family="'Anthropic Sans',sans-serif" font-size="11">1. Anyone opens a PR proposing a change to one of the five subdirectories</text>
<text x="60" y="538" fill="rgb(180,200,210)" font-family="'Anthropic Sans',sans-serif" font-size="11">2. CI runs `terraform plan` and posts the planned diff as a PR comment</text>
<text x="60" y="556" fill="rgb(180,200,210)" font-family="'Anthropic Sans',sans-serif" font-size="11">3. Required reviewers (CODEOWNERS) inspect and approve</text>
<text x="60" y="574" fill="rgb(180,200,210)" font-family="'Anthropic Sans',sans-serif" font-size="11">4. Merge → HCP Terraform auto-applies the change to the corresponding workspace</text>
<text x="60" y="592" fill="rgb(180,200,210)" font-family="'Anthropic Sans',sans-serif" font-size="11">5. Post-apply hook inserts a new row into substrate_versions</text>
<text x="60" y="610" fill="rgb(180,200,210)" font-family="'Anthropic Sans',sans-serif" font-size="11">6. Audit log fires automatically (Postgres trigger on substrate_versions)</text>
<text x="60" y="628" fill="rgb(180,200,210)" font-family="'Anthropic Sans',sans-serif" font-size="11">7. Next weekly Zenodo dump bundles this substrate version with the data of the period</text>

<line x1="410" y1="644" x2="410" y2="664" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

<!-- Database connections -->
<rect x="40" y="668" width="360" height="180" rx="10" fill="rgb(36,78,102)" stroke="rgb(124,188,220)" stroke-width="0.5"/>
<text x="60" y="692" fill="rgb(174,220,240)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="600">substrate_versions · the system's own VCS in the DB</text>
<text x="60" y="712" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">One append-only row per substrate change · forever</text>
<text x="60" y="730" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">Captures:</text>
<text x="60" y="748" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">  who proposed (github + orcid)</text>
<text x="60" y="764" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">  who approved (array of reviewers)</text>
<text x="60" y="780" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">  pull_request_url</text>
<text x="60" y="796" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">  terraform_state_sha256</text>
<text x="60" y="812" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">  workflow_yamls_sha256</text>
<text x="60" y="828" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">  schema_migration_sha256 · description</text>

<rect x="420" y="668" width="360" height="180" rx="10" fill="rgb(99,56,6)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
<text x="440" y="692" fill="rgb(250,199,117)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="600">archive_receipts · weekly Zenodo dump</text>
<text x="440" y="712" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="11">Each weekly DOI dump bundles the current</text>
<text x="440" y="728" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="11">substrate snapshot alongside the data:</text>
<text x="440" y="748" fill="rgb(250,199,117)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">  substrate_version_id (FK)</text>
<text x="440" y="766" fill="rgb(250,199,117)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="500">  substrate_snapshot_sha256</text>
<text x="440" y="788" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="11">So future researchers can:</text>
<text x="440" y="804" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="11">  · re-derive the Terraform state</text>
<text x="440" y="820" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="11">  · re-create the schema</text>
<text x="440" y="836" fill="rgb(239,159,39)" font-family="'Anthropic Sans',sans-serif" font-size="11">  · audit the rules of the system</text>

<!-- Closing note -->
<rect x="40" y="874" width="740" height="90" rx="10" fill="rgb(45,45,45)" stroke="rgb(120,120,120)" stroke-width="0.5"/>
<text x="60" y="900" fill="rgb(220,220,220)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="500">Recursive transparency</text>
<text x="60" y="922" fill="rgb(170,170,170)" font-family="'Anthropic Sans',sans-serif" font-size="11">Not just the data is public — the rules that governed the data are public too, archived in the same DOI as the data.</text>
<text x="60" y="942" fill="rgb(170,170,170)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-style="italic">A future researcher reading any Zenodo dump can verify what was reproduced AND what rules the reproduction operated under.</text>

</svg>
