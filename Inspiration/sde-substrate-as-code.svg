<svg width="100%" viewBox="0 0 820 990" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The Substrate · version-controlled foundation of the curation pipeline</title>
<desc>The substrate is the version-controlled system layer that defines the rules, schemas, and code of the curation pipeline. It lives in a single repo with five subdirectories, each watched by a corresponding HCP Terraform workspace. Every change goes through a pull request with mandatory review. Each substrate version is recorded in the substrate_versions database table, and each weekly Zenodo deposit bundles a snapshot of the substrate alongside the data.</desc>

