<svg width="100%" viewBox="0 0 800 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Approach B — Cryptographic Cross-Org Handoff (proposal for the H2 boundary)</title>
<desc>One of two proposed approaches for the H2 cross-organizational handoff. Sender signs a packing slip with a private Ed25519 key; receiver verifies the signature, recomputes file fingerprints, and signs a receipt back with its own key. Anyone with the published public keys can independently audit the chain. High rigor; requires PI buy-in on the receiver-side protocol.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="thickarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Title -->
<rect x="40" y="30" width="720" height="60" rx="12" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
<text x="400" y="56" text-anchor="middle" fill="rgb(211,209,199)" font-family="'Anthropic Sans',sans-serif" font-size="15" font-weight="500">Approach B · Cryptographic Cross-Org Handoff</text>
<text x="400" y="78" text-anchor="middle" fill="rgb(180,178,169)" font-family="'Anthropic Sans',sans-serif" font-size="12">How "the package leaves our system" becomes "mathematically verified to arrive intact"</text>

<text x="400" y="118" text-anchor="middle" fill="rgb(211,209,199)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="500">OWNERSHIP / RESPONSIBILITY · Curators own DB 1 · PI owns DB 2 · signed handoff crosses the boundary</text>

<!-- SENDER side -->
<rect x="40" y="140" width="320" height="330" rx="10" fill="rgb(36,78,102)" stroke="rgb(124,188,220)" stroke-width="0.5"/>
<text x="60" y="164" fill="rgb(174,220,240)" font-family="'Anthropic Sans',sans-serif" font-size="14" font-weight="500">SENDER side</text>
<text x="60" y="184" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">Auto-Transfer Bridge (M2)</text>

<text x="60" y="218" fill="rgb(174,220,240)" font-family="'Anthropic Sans',sans-serif" font-size="12" font-weight="500">Holds a private Ed25519 signing key</text>

<text x="60" y="250" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="12">1. Compute fingerprint of every file</text>
<text x="60" y="270" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="12">2. Build a packing slip listing:</text>
<text x="76" y="288" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">- who sent it (identity)</text>
<text x="76" y="304" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">- what is inside (files + fingerprints)</text>
<text x="76" y="320" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">- when it was sent (timestamp)</text>
<text x="76" y="336" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">- chain showing where it came from</text>
<text x="60" y="356" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="12">3. Sign packing slip with private key</text>
<text x="60" y="376" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="12">4. Send the package over HTTPS</text>

<text x="60" y="414" fill="rgb(174,220,240)" font-family="'Anthropic Sans',sans-serif" font-size="12" font-weight="500">Then: verify the receipt that comes back</text>
<text x="60" y="432" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">Using the receiver's published public key</text>
<text x="60" y="448" fill="rgb(124,188,220)" font-family="'Anthropic Sans',sans-serif" font-size="11">Retry if signature fails or hashes mismatch</text>

<!-- RECEIVER side -->
<rect x="440" y="140" width="320" height="330" rx="10" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
<text x="460" y="164" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="14" font-weight="500">RECEIVER side</text>
<text x="460" y="184" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="11">PI's chosen receiving system (whatever it is)</text>

<text x="460" y="218" fill="rgb(245,196,179)" font-family="'Anthropic Sans',sans-serif" font-size="12" font-weight="500">Holds own private key + sender's public key</text>

<text x="460" y="250" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="12">1. Verify sender's signature</text>
<text x="460" y="270" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="12">2. Recompute fingerprint of each file</text>
<text x="460" y="290" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="12">3. Compare against packing slip</text>
<text x="460" y="310" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="12">4. If all match: INSERT new row</text>
<text x="476" y="328" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="11">(append-only · audit log fires)</text>
<text x="460" y="348" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="12">5. Build a receipt with:</text>
<text x="476" y="366" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="11">- row ID where it was stored</text>
<text x="476" y="382" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="11">- verified flag + timestamp</text>
<text x="476" y="398" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="11">- reference to packing slip hash</text>
<text x="460" y="418" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="12">6. Sign receipt with own private key</text>
<text x="460" y="438" fill="rgb(240,153,123)" font-family="'Anthropic Sans',sans-serif" font-size="12">7. Return receipt to sender</text>

<!-- Forward arrow -->
<line x1="360" y1="220" x2="440" y2="220" marker-end="url(#thickarrow)" stroke="rgb(220,100,80)" stroke-width="2.5"/>
<text x="400" y="210" text-anchor="middle" fill="rgb(255,200,190)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="600">signed packing slip + files</text>

<!-- Backward arrow -->
<line x1="440" y1="380" x2="360" y2="380" marker-end="url(#thickarrow)" stroke="rgb(93,202,165)" stroke-width="2.5"/>
<text x="400" y="372" text-anchor="middle" fill="rgb(159,225,203)" font-family="'Anthropic Sans',sans-serif" font-size="11" font-weight="600">signed receipt</text>

<!-- Independent verifier -->
<rect x="60" y="500" width="680" height="84" rx="10" fill="rgb(45,45,45)" stroke="rgb(120,120,120)" stroke-width="0.5"/>
<text x="80" y="524" fill="rgb(200,200,200)" font-family="'Anthropic Sans',sans-serif" font-size="13" font-weight="500">Independent verifier (anyone with the published public keys)</text>
<text x="80" y="544" fill="rgb(180,178,169)" font-family="'Anthropic Sans',sans-serif" font-size="12">Can re-check every packing slip and every receipt without permission from anyone</text>
<text x="80" y="564" fill="rgb(180,178,169)" font-family="'Anthropic Sans',sans-serif" font-size="12">No central authority required — math does the verifying</text>

<!-- Why this design -->
<rect x="40" y="604" width="720" height="80" rx="10" fill="rgb(45,45,45)" stroke="rgb(120,120,120)" stroke-width="0.5"/>
<text x="60" y="628" fill="rgb(220,220,220)" font-family="'Anthropic Sans',sans-serif" font-size="12" font-weight="500">Why this design</text>
<text x="60" y="648" fill="rgb(170,170,170)" font-family="'Anthropic Sans',sans-serif" font-size="11">High rigor — mathematics, not trust, does the verification. Suitable for true cross-org boundaries.</text>
<text x="60" y="666" fill="rgb(170,170,170)" font-family="'Anthropic Sans',sans-serif" font-size="11">Requires PI buy-in: the receiver-side protocol must be implemented by whoever runs the PI's system.</text>

</svg>
