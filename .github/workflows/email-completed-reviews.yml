name: Email Completed Reviews

# Manual backfill: zip and email completed review folders that have not
# been sent. "Already sent" means the folder's review_metadata.yml has
# `emailed_to_recipient_on:` with a non-null value, written either here
# or by notify-on-complete.yml.
#
# Two modes:
#   - workflow_dispatch with no input: process every unsent folder.
#   - workflow_dispatch with folder_name input: process only that folder.
#
# Hand-committed completions for folders that DO have an associated issue
# are caught automatically by auto-label-completed.yml; this workflow is
# the fallback for legacy items with no issue, or when a single folder
# needs to be re-sent.

on:
  workflow_dispatch:
    inputs:
      folder_name:
        description: 'Folder under reviews/completed/ to send. Leave empty to process every unsent folder.'
        required: false
        type: string
        default: ''

concurrency:
  group: email-completed-reviews
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  email-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Zip and email each unsent completed review
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_LOGIN: ${{ secrets.SMTP_LOGIN }}
          SMTP_KEY: ${{ secrets.SMTP_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          INPUT_FOLDER: ${{ inputs.folder_name }}
        run: |
          python3 << 'EOF'
          import os, re, smtplib, zipfile, sys
          from datetime import datetime
          from email.message import EmailMessage
          from email.utils import formataddr

          smtp_server = os.environ['SMTP_SERVER']
          smtp_port   = int(os.environ['SMTP_PORT'])
          login       = os.environ['SMTP_LOGIN']
          password    = os.environ['SMTP_KEY']
          from_email  = os.environ['FROM_EMAIL']
          to_email    = os.environ['NOTIFY_TO']
          input_folder = (os.environ.get('INPUT_FOLDER') or '').strip()

          completed_dir = 'reviews/completed'

          if input_folder:
              if not os.path.isdir(os.path.join(completed_dir, input_folder)):
                  print(f'ERROR: folder not found: {completed_dir}/{input_folder}')
                  sys.exit(2)
              folders = [input_folder]
          else:
              folders = sorted(os.listdir(completed_dir))

          today = datetime.utcnow().strftime('%Y-%m-%d')
          sent, skipped = [], []

          def has_email_marker(rmeta_path):
              if not os.path.exists(rmeta_path):
                  return False
              with open(rmeta_path, 'r', encoding='utf-8') as f:
                  for line in f:
                      if line.strip().startswith('emailed_to_recipient_on:'):
                          value = line.split(':', 1)[1].strip().strip("'\"")
                          if value and value.lower() not in ('null', 'none', ''):
                              return True
              return False

          def write_email_marker(rmeta_path):
              line = f'emailed_to_recipient_on: {today}\n'
              if os.path.exists(rmeta_path):
                  with open(rmeta_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  if re.search(r'^emailed_to_recipient_on:.*$', content, flags=re.M):
                      content = re.sub(
                          r'^emailed_to_recipient_on:.*$',
                          f'emailed_to_recipient_on: {today}',
                          content,
                          flags=re.M,
                      )
                  else:
                      if content and not content.endswith('\n'):
                          content += '\n'
                      content += line
              else:
                  content = line
              with open(rmeta_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          for folder_name in folders:
              folder_path = os.path.join(completed_dir, folder_name)
              if not os.path.isdir(folder_path):
                  continue

              rmeta_path = os.path.join(folder_path, 'review_metadata.yml')
              if has_email_marker(rmeta_path):
                  skipped.append(folder_name)
                  print(f'- Skipped (already emailed): {folder_name}')
                  continue

              zip_path = f'/tmp/{folder_name}.zip'
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for root, dirs, files in os.walk(folder_path):
                      for file in files:
                          file_path = os.path.join(root, file)
                          arcname = os.path.relpath(file_path, completed_dir)
                          zf.write(file_path, arcname)

              msg = EmailMessage()
              msg['Subject'] = f'[SDE Review Complete] {folder_name}'
              msg['From']    = formataddr(('SDE Review Queue', from_email))
              msg['To']      = to_email
              msg['Cc']      = from_email
              msg.set_content(
                  f"A review package has been finalized.\n\n"
                  f"Manuscript: {folder_name}\n"
                  f"Location:   reviews/completed/{folder_name}\n\n"
                  f"The complete review package is attached as a zip file."
              )

              with open(zip_path, 'rb') as f:
                  msg.add_attachment(
                      f.read(),
                      maintype='application',
                      subtype='zip',
                      filename=f'{folder_name}.zip'
                  )

              with smtplib.SMTP(smtp_server, smtp_port) as s:
                  s.starttls()
                  s.login(login, password)
                  s.send_message(msg)

              write_email_marker(rmeta_path)
              sent.append(folder_name)
              print(f'+ Sent: {folder_name}')

          print(f'\nDone. {len(sent)} sent, {len(skipped)} already-emailed skipped.')
          if not sent:
              sys.exit(0)
          EOF

      - name: Commit and push email markers
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews/completed/
          if git diff --cached --quiet; then
            echo "No marker changes to commit."
          else
            git pull --rebase origin main
            git commit -m "Mark completed folders as emailed_to_recipient"
            git push origin main
          fi
