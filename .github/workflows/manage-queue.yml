name: Manage Queue (slash commands)

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  handle-command:
    if: github.event.issue.state == 'open' && (startsWith(github.event.comment.body, '/checkout') || startsWith(github.event.comment.body, '/release') || startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/dispute') || startsWith(github.event.comment.body, '/complete') || startsWith(github.event.comment.body, '/reject') || startsWith(github.event.comment.body, '/reopen'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Verify commenter is an authorized reviewer
        id: auth
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            try {
              await github.rest.repos.checkCollaborator({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                username: commenter,
              });
            } catch (e) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number,
                body: '@' + commenter + ' sorry - only authorized reviewers can run slash commands here.',
              });
              core.setFailed('unauthorized');
              return;
            }
            core.setOutput('user', commenter);

      - name: Dispatch command
        if: success()
        uses: actions/github-script@v7
        env:
          COMMENTER: ${{ steps.auth.outputs.user }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const commenter = process.env.COMMENTER;
            const body = context.payload.comment.body.trim();
            const cmd  = body.split(/\s+/)[0];
            const reason = body.replace(cmd, '').trim();
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            const reply = (msg) => github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number, body: msg,
            });

            const setLabels = async (toAdd, toRemove) => {
              for (const l of toRemove) {
                try { await github.rest.issues.removeLabel({
                  ...context.repo, issue_number: issue.number, name: l,
                }); } catch (_) {}
              }
              if (toAdd.length) {
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: issue.number, labels: toAdd,
                });
              }
            };

            const updateIssuePathMarkers = async (oldPath, newPath) => {
              let newBody = issue.body || '';
              if ((issue.body || '').match(/<!--\s*folder:\s*(.+?)\s*-->/)) {
                newBody = newBody.replace(/<!--\s*folder:\s*.+?\s*-->/, '<!-- folder: ' + newPath + ' -->');
              }
              if ((issue.body || '').match(/<!--\s*path:\s*(.+?)\s*-->/)) {
                newBody = newBody.replace(/<!--\s*path:\s*.+?\s*-->/, '<!-- path: ' + newPath + ' -->');
              }
              if (newBody !== (issue.body || '')) {
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  body: newBody,
                });
              }
            };

            const gitConfig = () => {
              execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
              execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            };

            const moveTrackedItemToStage = async (sourcePath, stageDir) => {
              const itemName = path.basename(sourcePath);
              const destPath = 'reviews/' + stageDir + '/' + itemName;
              if (sourcePath === destPath) return { moved: false, path: sourcePath };
              if (!sourcePath.startsWith('reviews/')) {
                throw new Error('Tracked path is outside reviews/: ' + sourcePath);
              }
              if (fs.existsSync(destPath)) {
                throw new Error('Destination already exists: ' + destPath);
              }
              fs.mkdirSync('reviews/' + stageDir, { recursive: true });
              gitConfig();
              execFileSync('git', ['mv', sourcePath, destPath]);
              execFileSync('git', ['add', '-A']);
              const pending = execFileSync('git', ['status', '--short']).toString().trim();
              if (pending) {
                execFileSync('git', ['commit', '-m', 'Queue move: ' + itemName + ' -> reviews/' + stageDir + ' (refs #' + issue.number + ')']);
                execFileSync('git', ['push']);
              }
              await updateIssuePathMarkers(sourcePath, destPath);
              return { moved: true, path: destPath };
            };

            const findSingleNotebook = (folderPath) => {
              const items = fs.readdirSync(folderPath);
              const notebooks = items.filter(item => item.endsWith('.ipynb'));
              if (notebooks.length === 0) throw new Error('No .ipynb notebook found in the review folder.');
              if (notebooks.length > 1) throw new Error('Multiple .ipynb notebooks found; expected exactly one.');
              return path.join(folderPath, notebooks[0]);
            };

            const createReviewStructure = (folderPath, notebookPath, reviewer, issueNumber) => {
              const notebookName = path.basename(notebookPath);
              const notebookBase = notebookName.replace(/\.ipynb$/, '');
              const checkoutTimestamp = new Date().toISOString();
              const paperFolder = path.basename(folderPath);

              fs.mkdirSync(path.join(folderPath, 'original'), { recursive: true });
              fs.mkdirSync(path.join(folderPath, 'review-copy'), { recursive: true });
              fs.mkdirSync(path.join(folderPath, 'notes'), { recursive: true });

              const originalPath = path.join(folderPath, 'original', notebookName);
              // Move the notebook directly into original/ — no duplicate ever exists
              fs.renameSync(notebookPath, originalPath);

              const reviewCopyPath = path.join(folderPath, 'review-copy', `${notebookBase}_rvd.ipynb`);
              fs.copyFileSync(originalPath, reviewCopyPath);

              const notesPath = path.join(folderPath, 'notes', 'review_notes.md');
              const notesTemplate = `# Review Notes

              - Reviewer: ${reviewer}
              - Checkout Time: ${checkoutTimestamp}
              - Paper Folder: ${paperFolder}
              - Issue: #${issueNumber}

              ## Summary

              ## Required Changes

              ## Comments

              ## Decision
              - [ ] Approved
              - [ ] Needs Changes
              `;
              fs.writeFileSync(notesPath, notesTemplate);

              const metadataPath = path.join(folderPath, 'review_metadata.yml');
              const metadata = `paper_id: "${paperFolder}"
              status: "in-progress"
              reviewer: "${reviewer}"
              checkout_timestamp: "${checkoutTimestamp}"
              original_notebook: "${notebookName}"
              review_copy_notebook: "${notebookBase}_rvd.ipynb"
              approval_timestamp: null
              approved_by: null
            `;
              fs.writeFileSync(metadataPath, metadata);
            };

            const validateReviewStructure = (folderPath) => {
              const requiredDirs = ['original', 'review-copy', 'notes'];
              for (const dir of requiredDirs) {
                if (!fs.existsSync(path.join(folderPath, dir))) {
                  throw new Error(`Missing required directory: ${dir}`);
                }
              }

              const originalNotebook = fs.readdirSync(path.join(folderPath, 'original')).find(f => f.endsWith('.ipynb'));
              if (!originalNotebook) {
                throw new Error('Missing original notebook in original/.');
              }
              const reviewCopyNotebook = fs.readdirSync(path.join(folderPath, 'review-copy')).find(f => f.endsWith('_rvd.ipynb'));
              if (!reviewCopyNotebook) {
                throw new Error('Missing reviewed notebook in review-copy/.');
              }

              const requiredFiles = [
                path.join('original', originalNotebook),
                path.join('review-copy', reviewCopyNotebook),
                path.join('notes', 'review_notes.md'),
                'review_metadata.yml'
              ];

              for (const file of requiredFiles) {
                if (!fs.existsSync(path.join(folderPath, file))) {
                  throw new Error(`Missing required file: ${file}`);
                }
              }

              const notesContent = fs.readFileSync(path.join(folderPath, 'notes', 'review_notes.md'), 'utf8');
              const sectionNames = ['## Summary', '## Required Changes', '## Comments'];
              const hasMeaningfulNotes = sectionNames.some((section) => {
                const sectionIndex = notesContent.indexOf(section);
                if (sectionIndex === -1) return false;
                const afterSection = notesContent.slice(sectionIndex + section.length);
                const nextHeadingIndex = afterSection.indexOf('##');
                const sectionText = nextHeadingIndex === -1
                  ? afterSection
                  : afterSection.slice(0, nextHeadingIndex);
                return sectionText.trim().length > 0;
              });
              if (!hasMeaningfulNotes) {
                throw new Error('Review notes must include meaningful content under at least one of ## Summary, ## Required Changes, or ## Comments.');
              }
            };

            const updateReviewMetadata = (metadataPath, updates) => {
              let content = fs.readFileSync(metadataPath, 'utf8');
              for (const [key, value] of Object.entries(updates)) {
                const regex = new RegExp(`^\\s*${key}:.*$`, 'm');
                const newLine = `${key}: ${value === null ? 'null' : `"${value}"`}`;
                if (content.match(regex)) {
                  content = content.replace(regex, newLine);
                } else {
                  content += `\n${newLine}`;
                }
              }
              fs.writeFileSync(metadataPath, content);
            };

            const resolveCurator = (folderPath) => {
              const metaPath = path.join(folderPath, 'metadata.yml');
              if (!fs.existsSync(metaPath)) return null;
              const yml = fs.readFileSync(metaPath, 'utf8');
              const m = yml.match(/^curator(?:_github)?:\s*(.+?)\s*$/m);
              return (m && m[1] && m[1] !== 'null') ? m[1] : null;
            };

            // Extract the tracked review item from issue body markers.
            const folderMatch = (issue.body || '').match(/<!--\s*folder:\s*(.+?)\s*-->/);
            const folder = folderMatch ? folderMatch[1] : null;
            const pathMatch = (issue.body || '').match(/<!--\s*path:\s*(.+?)\s*-->/);
            const trackedPath = folder || (pathMatch ? pathMatch[1] : null);
            const hasTrackedPath = !!trackedPath && fs.existsSync(trackedPath);
            const trackedStat = hasTrackedPath ? fs.statSync(trackedPath) : null;
            const isFolderItem = !!trackedStat && trackedStat.isDirectory();
            const isFileItem = !!trackedStat && trackedStat.isFile();

            let reviewer1 = null;
            if (folder && fs.existsSync(path.join(folder, 'metadata.yml'))) {
              const yml = fs.readFileSync(path.join(folder, 'metadata.yml'), 'utf8');
              const m = yml.match(/^reviewer_1:\s*(.+?)\s*$/m);
              if (m && m[1] && m[1] !== 'null') reviewer1 = m[1];
            }

            const reviewerLine = reviewer1
              ? 'The recorded first reviewer is @' + reviewer1 + '.'
              : 'No first reviewer is recorded for this item, so the workflow cannot enforce reviewer separation automatically.';

            // ---------- /checkout ----------
            if (cmd === '/checkout') {
              if (labels.includes('awaiting-review-2')) {
                if (!trackedPath) {
                  await reply('Could not determine which repository item this issue tracks (missing `<!-- folder: ... -->` or `<!-- path: ... -->` marker). Aborting checkout - contact the maintainer.');
                  return;
                }
                if (!hasTrackedPath) {
                  await reply('The tracked item for this issue was not found at `' + trackedPath + '`. Aborting checkout - contact the maintainer.');
                  return;
                }
                if (reviewer1 && reviewer1 === commenter) {
                  await reply('@' + commenter + ' you were the **first reviewer** for this item - a different reviewer must perform the second review.');
                  return;
                }
                await github.rest.issues.addAssignees({
                  ...context.repo, issue_number: issue.number, assignees: [commenter],
                });
                let activePath = trackedPath;
                try {
                  const moved = await moveTrackedItemToStage(trackedPath, 'in-progress');
                  activePath = moved.path;
                } catch (err) {
                  await reply('Could not move the tracked item into `reviews/in-progress/`: ' + err.message);
                  return;
                }
                if (isFolderItem) {
                  try {
                    const metadataPath = path.join(activePath, 'review_metadata.yml');
                    if (!fs.existsSync(metadataPath)) {
                      const notebookPath = findSingleNotebook(activePath);
                      createReviewStructure(activePath, notebookPath, commenter, issue.number);
                      execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
                      execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
                      execFileSync('git', ['add', '-A']);
                      const pending = execFileSync('git', ['status', '--short']).toString().trim();
                      if (pending) {
                        execFileSync('git', ['commit', '-m', `Setup review structure for ${path.basename(activePath)} (refs #${issue.number})`]);
                        execFileSync('git', ['push']);
                      }
                    }
                  } catch (err) {
                    await reply(`Review structure setup failed: ${err.message}`);
                    return;
                  }
                }
                await setLabels(['review-2-active'], ['awaiting-review-2', 'complete']);
                const itemSummary = isFolderItem
                  ? 'This issue is linked to the review folder `' + activePath + '`.'
                  : isFileItem
                    ? 'This issue is linked to the standalone review file `' + activePath + '`.'
                    : 'This issue is linked to `' + activePath + '`.';
                const notebookMsg = isFolderItem
                  ? '\n\nYour copy is ready at `' + activePath + '/review-copy/`. Open the `_rvd.ipynb` file — do not edit the original. Add `#SOURCE: p.X` where you found each value, and `#CHANGED: reason` above anything you change.'
                  : '';
                await reply(
                  '@' + commenter + ' checked out for **second review**. The tracked item was moved to `reviews/in-progress/` and the issue is now `review-2-active`. ' +
                  itemSummary + ' ' + reviewerLine + notebookMsg +
                  '\n\nWhen done:\n- Comment `/approve` if the review is complete and correct — this will move the item straight to `completed/`.\n- Comment `/dispute <reason>` if you disagree with something — this will flag the item for curator review.\n- Comment `/release` to return it to `awaiting-review-2` without a decision.'
                );
                return;
              }
              await reply('This item is not currently checkable-out (state: `' + labels.join(', ') + '`).');
              return;
            }

            // ---------- /release ----------
            if (cmd === '/release') {
              if (!labels.includes('review-2-active')) {
                await reply('`/release` is only valid during an active review (current: `' + labels.join(', ') + '`).');
                return;
              }
              const assignees = (issue.assignees || []).map(a => a.login);
              if (!assignees.includes(commenter)) {
                await reply('@' + commenter + ' you are not the current reviewer on this item.');
                return;
              }
              await github.rest.issues.removeAssignees({
                ...context.repo, issue_number: issue.number, assignees: [commenter],
              });
              if (trackedPath && hasTrackedPath) {
                try {
                  await moveTrackedItemToStage(trackedPath, 'awaiting-review-2');
                } catch (err) {
                  await reply('Could not move the tracked item back to `reviews/awaiting-review-2/`: ' + err.message);
                  return;
                }
              }
              await setLabels(['awaiting-review-2'], ['review-2-active']);
              await reply('Released by @' + commenter + '. The item is back in `awaiting-review-2`.');
              return;
            }

            // ---------- /approve ----------
            // Used by Reviewer 2 when the review is complete and correct.
            // Moves the item straight to completed/ — no curator step needed.
            if (cmd === '/approve') {
              if (!labels.includes('review-2-active')) {
                await reply('`/approve` is only valid during an active review (current: `' + labels.join(', ') + '`). If this review is disputed, the curator must use `/complete` or `/reject`.');
                return;
              }
              const assignees = (issue.assignees || []).map(a => a.login);
              if (!assignees.includes(commenter)) {
                await reply('@' + commenter + ' only the assigned second reviewer can approve.');
                return;
              }
              if (reviewer1 && reviewer1 === commenter) {
                await reply('@' + commenter + ' integrity check failed: you are recorded as the first reviewer and cannot approve.');
                return;
              }
              if (isFolderItem && trackedPath) {
                try {
                  validateReviewStructure(trackedPath);
                } catch (err) {
                  await reply('Approval validation failed: ' + err.message);
                  return;
                }
              }
              let completedPath = trackedPath;
              if (trackedPath && hasTrackedPath) {
                try {
                  const moved = await moveTrackedItemToStage(trackedPath, 'completed');
                  completedPath = moved.path;
                } catch (err) {
                  await reply('Could not move to `reviews/completed/`: ' + err.message);
                  return;
                }
              }
              if (completedPath && fs.existsSync(completedPath) && fs.statSync(completedPath).isDirectory()) {
                const metaPath = path.join(completedPath, 'review_metadata.yml');
                if (fs.existsSync(metaPath)) {
                  updateReviewMetadata(metaPath, {
                    status: 'completed',
                    approval_timestamp: new Date().toISOString(),
                    approved_by: commenter,
                  });
                  gitConfig();
                  execFileSync('git', ['add', metaPath]);
                  execFileSync('git', ['commit', '-m', 'Complete: ' + path.basename(completedPath) + ' approved by @' + commenter + ' (refs #' + issue.number + ')']);
                  execFileSync('git', ['push']);
                }
              }
              await setLabels(['complete'], ['review-2-active']);
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              await reply('✅ Approved by @' + commenter + '. The review is complete and has been moved to `reviews/completed/`. Issue closed.');
              return;
            }

            // ---------- /dispute ----------
            // Used by Reviewer 2 when they disagree with something in the file.
            // Flags the item for curator review — only the curator can resolve it.
            if (cmd === '/dispute') {
              if (!labels.includes('review-2-active')) {
                await reply('`/dispute` is only valid during an active review (current: `' + labels.join(', ') + '`).');
                return;
              }
              const assignees = (issue.assignees || []).map(a => a.login);
              if (!assignees.includes(commenter)) {
                await reply('@' + commenter + ' only the assigned second reviewer can raise a dispute.');
                return;
              }
              if (!reason) {
                await reply('Please provide a reason for the dispute. Usage: `/dispute your reason here`');
                return;
              }
              let curatorGithub = null;
              if (isFolderItem && trackedPath) {
                curatorGithub = resolveCurator(trackedPath);
              }
              await setLabels(['disputed'], ['review-2-active']);
              const curatorNotice = curatorGithub
                ? '\n\nCurator @' + curatorGithub + ' has been notified and must now resolve this dispute using `/complete` or `/reject`.'
                : '\n\nA curator must now resolve this dispute using `/complete` or `/reject`.';
              await reply(
                '⚠️ Dispute raised by @' + commenter + ': ' + reason +
                curatorNotice
              );
              return;
            }

            // ---------- /complete ----------
            // Curator only. Used to finalize a disputed item and move it to completed/.
            if (cmd === '/complete') {
              if (!labels.includes('disputed')) {
                await reply('`/complete` is only valid on a disputed review (current: `' + labels.join(', ') + '`). For a normal review, the reviewer uses `/approve`.');
                return;
              }
              let curatorGithub = null;
              if (isFolderItem && trackedPath) {
                curatorGithub = resolveCurator(trackedPath);
              }
              if (curatorGithub && commenter !== curatorGithub) {
                await reply('@' + commenter + ' only the curator (@' + curatorGithub + ') can complete a disputed review.');
                return;
              }
              if (isFolderItem && trackedPath) {
                try {
                  validateReviewStructure(trackedPath);
                } catch (err) {
                  await reply('Completion validation failed: ' + err.message);
                  return;
                }
              }
              let completedPath = trackedPath;
              if (trackedPath && hasTrackedPath) {
                try {
                  const moved = await moveTrackedItemToStage(trackedPath, 'completed');
                  completedPath = moved.path;
                } catch (err) {
                  await reply('Could not move to `reviews/completed/`: ' + err.message);
                  return;
                }
              }
              if (completedPath && fs.existsSync(completedPath) && fs.statSync(completedPath).isDirectory()) {
                const metaPath = path.join(completedPath, 'review_metadata.yml');
                if (fs.existsSync(metaPath)) {
                  updateReviewMetadata(metaPath, {
                    status: 'completed',
                    approval_timestamp: new Date().toISOString(),
                    approved_by: commenter,
                  });
                  gitConfig();
                  execFileSync('git', ['add', metaPath]);
                  execFileSync('git', ['commit', '-m', 'Complete (curator): ' + path.basename(completedPath) + ' resolved by @' + commenter + ' (refs #' + issue.number + ')']);
                  execFileSync('git', ['push']);
                }
              }
              await setLabels(['complete'], ['disputed']);
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              await reply('✅ Dispute resolved by curator @' + commenter + '. The review has been moved to `reviews/completed/`. Issue closed.');
              return;
            }

            // ---------- /reject ----------
            // Curator only. Used when the curator disagrees with the reviewer's changes.
            // Item stays in place, flagged for further discussion.
            if (cmd === '/reject') {
              if (!labels.includes('disputed')) {
                await reply('`/reject` is only valid on a disputed review (current: `' + labels.join(', ') + '`).');
                return;
              }
              let curatorGithub = null;
              if (isFolderItem && trackedPath) {
                curatorGithub = resolveCurator(trackedPath);
              }
              if (curatorGithub && commenter !== curatorGithub) {
                await reply('@' + commenter + ' only the curator (@' + curatorGithub + ') can reject a disputed review.');
                return;
              }
              if (!reason) {
                await reply('Please provide a reason for the rejection. Usage: `/reject your reason here`');
                return;
              }
              // Item stays where it is. Label updated to reflect curator rejection, kept open for discussion.
              await setLabels(['curator-rejected'], ['disputed']);
              await reply(
                '❌ Rejected by curator @' + commenter + ': ' + reason +
                '\n\nThis item remains flagged and open for further discussion. Either party can comment `/reopen` to return the item to active second review once a path forward is agreed.'
              );
              return;
            }

            // ---------- /reopen ----------
            // Used after /reject when the reviewer and curator have agreed on a path forward.
            // Either the assigned reviewer or the recorded curator can run this.
            // Returns the item to review-2-active so the reviewer can update and re-/approve or re-/dispute.
            if (cmd === '/reopen') {
              if (!labels.includes('curator-rejected')) {
                await reply('`/reopen` is only valid on a curator-rejected review (current: `' + labels.join(', ') + '`).');
                return;
              }
              let curatorGithub = null;
              if (isFolderItem && trackedPath) {
                curatorGithub = resolveCurator(trackedPath);
              }
              const assignees = (issue.assignees || []).map(a => a.login);
              const isAssignedReviewer = assignees.includes(commenter);
              const isCurator = curatorGithub && commenter === curatorGithub;
              if (!isAssignedReviewer && !isCurator) {
                await reply('@' + commenter + ' only the assigned reviewer or the curator can reopen a rejected review.');
                return;
              }
              await setLabels(['review-2-active'], ['curator-rejected']);
              await reply(
                '🔄 Reopened by @' + commenter + '. The item is back in `review-2-active`. The reviewer can now update the notebook and comment `/approve` or `/dispute` again.'
              );
              return;
            }
